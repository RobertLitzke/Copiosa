verbs:

  # -- Wholly irregular ------------------------------------------------------------------------
  # Their present and preterite share no stem with the infinitive, so every cell is suppletive and
  # the struck-through naive form is suppressed automatically.

  ser:
    gloss: to be
    weight: 0.35        # already drilled by ContrastCategory.SER_ESTAR, and impossible to avoid
    default_class: suppletive

  ir:
    gloss: to go
    weight: 0.35
    default_class: suppletive

  haber:
    gloss: to have (auxiliary)
    weight: 0.35
    default_class: suppletive
    # Compound tenses are out of scope, so asking a learner to *produce* "hemos" alone drills a form
    # they would never emit by itself. Recognising "hubiera" / "habría" / "haya" still matters.
    restriction:
      directions: [decode]
    alternates:
      pres.3s: hay      # impersonal "hay" beside auxiliary "ha"

  estar:
    gloss: to be (state)
    weight: 0.35
    # The dump's estar entry carries no conjugation table at all, which silently dropped the single
    # most important verb in the drill. Supplied by hand; the cascade classifies it from here as
    # normal (yo_oy, accent_shift, strong_pret_u).
    forms:
      pres.1s: estoy
      pres.2s: estás
      pres.3s: está
      pres.1p: estamos
      pres.2p: estáis
      pres.3p: están
      pret.1s: estuve
      pret.2s: estuviste
      pret.3s: estuvo
      pret.1p: estuvimos
      pret.2p: estuvisteis
      pret.3p: estuvieron
      imp.1s: estaba
      imp.2s: estabas
      imp.3s: estaba
      imp.1p: estábamos
      imp.2p: estabais
      imp.3p: estaban
      fut.1s: estaré
      fut.2s: estarás
      fut.3s: estará
      fut.1p: estaremos
      fut.2p: estaréis
      fut.3p: estarán
      cond.1s: estaría
      cond.2s: estarías
      cond.3s: estaría
      cond.1p: estaríamos
      cond.2p: estaríais
      cond.3p: estarían
      sub_pres.1s: esté
      sub_pres.2s: estés
      sub_pres.3s: esté
      sub_pres.1p: estemos
      sub_pres.2p: estéis
      sub_pres.3p: estén

  # -- Cells the cascade can't place --------------------------------------------------------------

  dar:
    gloss: to give
    # dar borrows the -er/-ir preterite wholesale rather than changing stem or ending in any
    # patterned way; no tidier class fits.
    classes:
      pret.1s: other_irregular
      pret.2s: other_irregular
      pret.3s: other_irregular
      pret.1p: other_irregular
      pret.2p: other_irregular
      pret.3p: other_irregular

  # -gu- verbs change twice at once: the e->i stem raise, plus the silent u of "gu" that only
  # survives before e/i. The cascade sees one span and can't name both halves.
  seguir:
    gloss: to follow
    classes:
      pres.1s: [stem_e_i, orth_ger_gir_guir]
      pres.2s: stem_e_i
      pres.3s: stem_e_i
      pres.3p: stem_e_i
      pret.3s: stem_raise_pret
      pret.3p: stem_raise_pret
      sub_pres.1s: [stem_e_i, orth_ger_gir_guir]
      sub_pres.2s: [stem_e_i, orth_ger_gir_guir]
      sub_pres.3s: [stem_e_i, orth_ger_gir_guir]
      sub_pres.1p: [stem_e_i, orth_ger_gir_guir]
      sub_pres.2p: [stem_e_i, orth_ger_gir_guir]
      sub_pres.3p: [stem_e_i, orth_ger_gir_guir]

  conseguir:
    gloss: to obtain
    classes:
      pres.1s: [stem_e_i, orth_ger_gir_guir]
      pres.2s: stem_e_i
      pres.3s: stem_e_i
      pres.3p: stem_e_i
      pret.3s: stem_raise_pret
      pret.3p: stem_raise_pret
      sub_pres.1s: [stem_e_i, orth_ger_gir_guir]
      sub_pres.2s: [stem_e_i, orth_ger_gir_guir]
      sub_pres.3s: [stem_e_i, orth_ger_gir_guir]
      sub_pres.1p: [stem_e_i, orth_ger_gir_guir]
      sub_pres.2p: [stem_e_i, orth_ger_gir_guir]
      sub_pres.3p: [stem_e_i, orth_ger_gir_guir]

  # oír inserts a y between vowels rather than changing its stem vowel.
  oír:
    gloss: to hear
    classes:
      pres.2s: orth_y_hiatus
      pres.3s: orth_y_hiatus
      pres.3p: orth_y_hiatus

  # reír contracts its stem against the ending: ri- + -eron, not re- + -ieron. Either analysis loses
  # an i, so the dropped-i class is the honest label.
  reír:
    gloss: to laugh
    classes:
      pret.3s: orth_i_loss
      pret.3p: orth_i_loss
