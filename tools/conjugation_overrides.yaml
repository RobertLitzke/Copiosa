# Curated adjudication for tools/build_conjugations.py.
#
# The generator sources forms and classifies deviations mechanically. This file carries everything
# that needs a human: English glosses, deliberate frequency damping, which cards a defective verb may
# appear in, and corrections for deviations the classification cascade can't place.
#
# Per verb:
#   gloss          English gloss shown beside the infinitive on a produce prompt.
#   weight         Selection multiplier applied after the frequency curve. 1.0 = neutral.
#   default_class  Class for any cell the cascade leaves unclassified. For wholly irregular verbs,
#                  this replaces twenty near-identical per-cell corrections.
#   classes        Per-cell correction, keyed "<tense>.<person>" (e.g. "pres.1s"). A single class or
#                  a list. `sub_imp` is rejected: that tense is derived from the preterite at runtime.
#   suppress_naive Cells whose regular counterpart shouldn't be shown struck through. The engine
#                  already suppresses suppletive verbs and stems under two characters; this is for
#                  anything those miss.
#   alternates     A second form that coexists with the canonical one. Shown in the reference tables,
#                  never used as a drill prompt or answer.
#   restriction    Limits which cards the verb appears in: directions / tenses / persons.

# Lemmas the frequency roll-up floats into the top 200 that nobody would drill. Each is a real
# Wiktionary verb entry whose count comes almost entirely from a homograph that survived the
# non-verb filter -- either another verb's forms, or an accented word the corpus writes unaccented.
exclude:
  - tar         # essentially unused; count comes from noise
  - dolar       # "to plane wood"; the corpus's unaccented spelling of dólar
  - podar       # "to prune"; collides with poder's subjunctive (podamos, podas)
  - vengar      # "to avenge"; collides with venir's subjunctive (venga, vengas, vengamos)
  - casar       # "to marry off"; collides with casa and with the far commoner reflexive casarse
  - parir       # "to give birth"; collides across parar's and parecer's paradigms
  - coser       # "to sew"; collides with cocer and is rare in the corpus

