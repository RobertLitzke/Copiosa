# Curated adjudication for `python tools/build_conjugations.py --lang pt`.
#
# Same contract as conjugation_overrides.yaml (see its header for the full field list): the generator
# sources forms and classifies deviations mechanically, and everything needing a human lives here —
# English glosses, deliberate frequency damping, defective-verb restrictions, and corrections for
# deviations the cascade can't place.
#
# This is European Portuguese. Where a verb differs between pt-PT and pt-BR the pt-PT reading wins.

# Surface forms that are not infinitives but end like one, so the ranking floats them in:
#   for    — future subjunctive of ser/ir, spelled like an -or verb
#   tiver  — future subjunctive of ter
#   tar    — the colloquial clipping of estar ("tou", "tás"); a register the drill shouldn't teach
#   parir  — real, but its count is almost entirely partir's forms misattributed
#   desposar — the dump files casar's whole paradigm under it, so every cell would be wrong
exclude:
  - for
  - tiver
  - tar
  - parir
  - foder
  - desposar

# ser/estar/ter/ir tower over everything else and are met constantly in ordinary input; without
# damping they would crowd the drill. ser/estar are also already drilled by ContrastCategory.SER_ESTAR.
verbs:
  ser:
    weight: 0.35
  estar:
    weight: 0.35
  ter:
    weight: 0.4
  ir:
    weight: 0.5
  ouvir:
    # The dump writes the third-plural imperfect subjunctive as "ouvíssem". Portuguese accents that
    # paradigm only in the two plural persons that shift stress (ouvíssemos, ouvísseis); the
    # third plural is ouvissem. Left uncorrected it would be stored as a deviation and drilled.
    forms:
      sub_imp.3p: ouvissem
  haver:
    weight: 0.3
    # Compound tenses are out of scope, so producing "hei" in isolation drills a form nobody emits
    # alone — but recognising "houvesse" genuinely matters. Mirrors Spanish's haber.
    restriction:
      directions: [DECODE]

