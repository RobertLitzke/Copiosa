# Curated adjudication for tools/build_frequency.py (Spanish).
#
# The generator lemmatises and filters mechanically. This file carries the decisions that need a
# human: which closed-class words are grammar rather than vocabulary, which corpus artefacts to
# throw away, and the handful of surface forms the resolution rule sends to the wrong headword.
#
#   stoplist  Closed-class grammar. Dropped even though the pack tags them as content words --
#             Wiktionary calls possessives and demonstratives "adj", so the part-of-speech filter
#             in the generator cannot see them. Contentful adverbs (siempre, nunca, aqui, bien)
#             are deliberately NOT here: they are ordinary vocabulary worth a card.
#   drop      Corpus artefacts: subtitle noise, unaccented misspellings the pack resolves to a
#             different word, and proper nouns the "name" filter missed.
#   remap     Surface form -> the lemma it should count towards, overriding the rules.

stoplist:
  # Articles and contractions
  - "el"
  - "la"
  - "los"
  - "las"
  - "lo"
  - "un"
  - "una"
  - "unos"
  - "unas"
  - "al"
  - "del"
  # Possessives
  - "mi"
  - "mis"
  - "tu"
  - "tus"
  - "su"
  - "sus"
  - "nuestro"
  - "nuestra"
  - "nuestros"
  - "nuestras"
  - "vuestro"
  - "vuestra"
  - "vuestros"
  - "vuestras"
  - "mio"
  - "mía"
  - "mío"
  - "suyo"
  - "suya"
  - "tuyo"
  - "tuya"
  # Demonstratives
  - "este"
  - "esta"
  - "estos"
  - "estas"
  - "esto"
  - "ese"
  - "esa"
  - "esos"
  - "esas"
  - "eso"
  - "aquel"
  - "aquella"
  - "aquellos"
  - "aquellas"
  - "aquello"
  # Personal and other pronouns
  - "yo"
  - "tú"
  - "tu"
  - "él"
  - "ella"
  - "ellos"
  - "ellas"
  - "nosotros"
  - "nosotras"
  - "vosotros"
  - "vosotras"
  - "usted"
  - "ustedes"
  - "me"
  - "te"
  - "se"
  - "nos"
  - "os"
  - "le"
  - "les"
  - "mí"
  - "ti"
  - "sí"
  - "conmigo"
  - "contigo"
  - "quien"
  - "quienes"
  - "cuyo"
  - "cuya"
  # Quantifiers and indefinite determiners
  - "todo"
  - "toda"
  - "todos"
  - "todas"
  - "otro"
  - "otra"
  - "otros"
  - "otras"
  - "mucho"
  - "mucha"
  - "muchos"
  - "muchas"
  - "poco"
  - "poca"
  - "pocos"
  - "pocas"
  - "tanto"
  - "tanta"
  - "tantos"
  - "tantas"
  - "cada"
  - "varios"
  - "varias"
  - "cierto"
  - "cierta"
  - "mismo"
  - "misma"
  - "mismos"
  - "mismas"
  - "cualquier"
  - "cualquiera"
  - "alguno"
  - "alguna"
  - "algunos"
  - "algunas"
  - "algún"
  - "ninguno"
  - "ninguna"
  - "ningún"
  - "ambos"
  - "demás"
  # Interrogatives and relatives
  - "qué"
  - "que"
  - "quién"
  - "quiénes"
  - "cuál"
  - "cuáles"
  - "cuánto"
  - "cuánta"
  - "cuántos"
  - "cuántas"
  - "cómo"
  - "cuándo"
  - "dónde"
  - "donde"
  - "cuanto"
  - "cuando"
  - "como"
  # Negation, affirmation and degree particles
  - "no"
  - "sí"
  - "si"
  - "ya"
  - "muy"
  - "más"
  - "mas"
  - "menos"
  - "tan"
  - "solo"
  - "sólo"
  - "también"
  - "tampoco"
  # Bare prepositions and conjunctions the pack sometimes tags as content words
  - "de"
  - "a"
  - "en"
  - "por"
  - "para"
  - "con"
  - "sin"
  - "sobre"
  - "entre"
  - "hasta"
  - "desde"
  - "hacia"
  - "según"
  - "durante"
  - "mediante"
  - "y"
  - "e"
  - "o"
  - "u"
  - "ni"
  - "pero"
  - "pues"
  - "porque"
  - "aunque"
  - "sino"

drop:
  # Unaccented corpus spellings the pack resolves to a different, rarer word.
  # "dolar" is the corpus's spelling of "dólar" and reads as "to plane wood".
  - "dolar"
  - "tio"
  - "mama"
  - "papa"
  # Non-lexical subtitle noise: filler sounds and loanwords that are not Spanish vocabulary.
  - "mm"
  - "mmm"
  # Letter names. "ere" is the name of the letter R; its whole corpus count is "eres" (you are).
  - "ere"
  - "efe"
  - "equis"
  - "eh"
  - "ah"
  - "oh"
  - "uh"
  - "uy"
  - "ok"
  - "okay"
  - "sr"
  - "sra"
  - "srta"

remap:
  # "gracias" is a fixed expression in its own right, not a plural of the noun "gracia".
  gracias: gracias
  # Comparatives worth holding as their own words rather than folding into bueno/malo.
  mejor: mejor
  peor: peor
  # Verb forms the pack also files as the feminine of a rare adjective, or as a noun. Each is
  # overwhelmingly the verb in this corpus, but not by the 2.5x margin SELF_BIAS asks for.
  queda: quedar
  quedas: quedar
  lamento: lamentar
  # Apocopated determiner-position forms, which have no entry of their own.
  primer: primero
  tercer: tercero
  gran: grande
