# Curated adjudication for tools/build_frequency.py (European Portuguese).
#
# Same three sections as frequency_overrides_es.yaml; see that file's header for what each does.
# The Portuguese pack tags its closed-class words more accurately than the Spanish one, so this
# stoplist is shorter -- most determiners and pronouns are already caught by the part-of-speech
# filter in the generator.
#
# Every entry is quoted: YAML reads a bare `nao`-style token fine, but `no`, `on` and `off` become
# booleans, and quoting uniformly means nobody has to remember which.

stoplist:
  # Articles and contractions
  - "o"
  - "a"
  - "os"
  - "as"
  - "um"
  - "uma"
  - "uns"
  - "umas"
  - "do"
  - "da"
  - "dos"
  - "das"
  - "no"
  - "na"
  - "nos"
  - "nas"
  - "ao"
  - "aos"
  - "pelo"
  - "pela"
  # Possessives
  - "meu"
  - "minha"
  - "meus"
  - "minhas"
  - "teu"
  - "tua"
  - "teus"
  - "tuas"
  - "seu"
  - "sua"
  - "seus"
  - "suas"
  - "nosso"
  - "nossa"
  - "nossos"
  - "nossas"
  # Demonstratives
  - "este"
  - "esta"
  - "estes"
  - "estas"
  - "isto"
  - "esse"
  - "essa"
  - "esses"
  - "essas"
  - "isso"
  - "aquele"
  - "aquela"
  - "aqueles"
  - "aquelas"
  - "aquilo"
  # Personal and other pronouns
  - "eu"
  - "tu"
  - "ele"
  - "ela"
  - "eles"
  - "elas"
  - "nós"
  - "vós"
  - "você"
  - "vocês"
  - "me"
  - "te"
  - "se"
  - "lhe"
  - "lhes"
  - "mim"
  - "ti"
  - "si"
  - "quem"
  - "cujo"
  - "cuja"
  # Quantifiers and indefinite determiners
  - "todo"
  - "toda"
  - "todos"
  - "todas"
  - "outro"
  - "outra"
  - "outros"
  - "outras"
  - "muito"
  - "muita"
  - "muitos"
  - "muitas"
  - "pouco"
  - "pouca"
  - "poucos"
  - "poucas"
  - "tanto"
  - "tanta"
  - "cada"
  - "vários"
  - "várias"
  - "mesmo"
  - "mesma"
  - "mesmos"
  - "mesmas"
  - "qualquer"
  - "algum"
  - "alguma"
  - "alguns"
  - "algumas"
  - "nenhum"
  - "nenhuma"
  - "ambos"
  - "demais"
  # Interrogatives and relatives
  - "que"
  - "quê"
  - "qual"
  - "quais"
  - "quanto"
  - "quanta"
  - "quantos"
  - "quantas"
  - "como"
  - "quando"
  - "onde"
  - "porquê"
  - "porque"
  # Negation, affirmation and degree particles
  - "não"
  - "sim"
  - "já"
  - "mais"
  - "menos"
  - "tão"
  - "só"
  - "também"
  - "tampouco"
  # Bare prepositions and conjunctions the pack sometimes tags as content words
  - "de"
  - "em"
  - "por"
  - "para"
  - "com"
  - "sem"
  - "sobre"
  - "entre"
  - "até"
  - "desde"
  - "durante"
  - "e"
  - "ou"
  - "nem"
  - "mas"
  - "pois"
  - "embora"
  - "se"

drop:
  # Non-lexical subtitle noise.
  - "hã"
  - "ah"
  - "oh"
  - "eh"
  - "uh"
  - "hum"
  - "ok"
  - "okay"
  - "sr"
  - "sra"

remap:
  # Third-person present forms the pack also files as a standalone entry with a stub paradigm.
  # The MIN_PARADIGM guard catches most; these carry enough corpus weight to be worth pinning.
  está: estar
  há: haver
  é: ser
  vai: ir
  tem: ter
